# Plymouth draws the disk password prompt and the boot splash, as on x86
# Collie. It goes right after systemd so its initrd units order correctly,
# only when the hook is installed, and never twice.
if [[ -f /usr/lib/initcpio/install/plymouth && " ${HOOKS[*]} " != *" plymouth "* ]]; then
  _collie_mac_plymouth_hooks=()
  _collie_mac_plymouth_added=false
  for _collie_mac_plymouth_hook in "${HOOKS[@]}"; do
    _collie_mac_plymouth_hooks+=("$_collie_mac_plymouth_hook")
    if [[ $_collie_mac_plymouth_hook == systemd && $_collie_mac_plymouth_added == false ]]; then
      _collie_mac_plymouth_hooks+=(plymouth)
      _collie_mac_plymouth_added=true
    fi
  done
  if [[ $_collie_mac_plymouth_added == true ]]; then
    HOOKS=("${_collie_mac_plymouth_hooks[@]}")
  fi
  unset _collie_mac_plymouth_hooks _collie_mac_plymouth_added _collie_mac_plymouth_hook
fi
