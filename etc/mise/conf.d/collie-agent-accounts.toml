# Resolve the active subscription at execution time, including in subprocesses.
# User and project mise config can override these system defaults.
[wrappers.claude]
command = "collie-agent-account-exec"
args = ["claude"]

[wrappers.codex]
command = "collie-agent-account-exec"
args = ["codex"]

[wrappers.grok]
command = "collie-agent-account-exec"
args = ["grok"]
